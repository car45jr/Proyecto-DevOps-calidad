# Pipeline CI/CD para GitLab
# Ejemplo académico para demostración de interoperabilidad entre plataformas DevOps

image: python:3.11-slim

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/
    - venv/

before_script:
  - python --version
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

test_job:
  stage: test
  script:
    - pytest -v
    - pytest --cov=app --cov-report=term-missing --cov-report=xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
