# Configuración del proyecto para SonarQube / SonarCloud
# Clave única del proyecto dentro del servidor SonarQube / SonarCloud
sonar.projectKey=proyecto-devops-calidad
sonar.projectName=Proyecto DevOps Calidad
sonar.projectVersion=1.0.0

# Rutas de código fuente y pruebas
sonar.sources=app.py
sonar.tests=test_app.py

# Codificación de archivos
sonar.sourceEncoding=UTF-8

# Integración del reporte de cobertura generado por pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Exclusión de archivos que no requieren análisis de calidad
sonar.exclusions=venv/**, .venv/**, docs/**, **/__pycache__/**
