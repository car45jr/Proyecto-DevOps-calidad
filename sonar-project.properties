# Identificacion del proyecto en SonarQube Cloud
sonar.projectKey=car45jr_Proyecto-DevOps-calidad
sonar.organization=car45jr
sonar.projectName=Proyecto-DevOps-calidad
sonar.projectVersion=1.0.0

# Version de Python
sonar.python.version=3.11

# Codigo fuente y pruebas
