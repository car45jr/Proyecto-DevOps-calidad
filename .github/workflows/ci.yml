name: CI - Pruebas y Calidad

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Pruebas Automatizadas y Cobertura
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código del repositorio
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Instalar dependencias del proyecto
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Ejecutar pruebas unitarias con pytest
      - name: Ejecutar pruebas automatizadas con pytest
        run: |
          pytest -v

      # 5. Medir cobertura de código con pytest-cov
      - name: Medir cobertura de pruebas
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

      # 6. Paso opcional para SonarCloud / SonarQube (solo se ejecuta si existe el secreto configurado)
      - name: Escaneo de calidad con SonarCloud (Opcional)
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarcloud-github-action@master
